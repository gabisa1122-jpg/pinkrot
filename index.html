<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pinkrot.net</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background: radial-gradient(circle at top, #ffb6d5, #2a001f, #000);
}

/* animated pink haze */
.bg {
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,105,180,0.25), transparent 60%);
    animation: drift 10s infinite alternate ease-in-out;
    filter: blur(50px);
    z-index: -1;
}

@keyframes drift {
    from { transform: translate(-10%, -10%); }
    to { transform: translate(10%, 10%); }
}

/* center box */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* title */
.glitch {
    font-size: 32px;
    letter-spacing: 5px;
    animation: flicker 2.5s infinite;
    text-shadow: 0 0 10px #ff69b4;
}

@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* input */
input {
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: 1px solid #ff69b4;
    color: white;
    outline: none;
}

/* button */
button {
    margin-top: 10px;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #ff69b4;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff69b4;
    color: black;
}

#msg {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.7;
}

/* cursor glow */
.glow {
    position: fixed;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255,105,180,0.4), transparent);
    pointer-events: none;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    filter: blur(20px);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="glow" id="glow"></div>

<div class="center">
    <div class="glitch">pinkrot.net</div>
    <p>invitation required</p>

    <input id="code" placeholder="invite code">
    <br>
    <button onclick="enterSite()">enter</button>

    <p id="msg"></p>
</div>

<script>
// cursor glow
document.addEventListener("mousemove", (e) => {
    const glow = document.getElementById("glow");
    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";
});

// login system
function enterSite() {
    const code = document.getElementById("code").value;
    const msg = document.getElementById("msg");

    if (code === "pinkrot") {
        msg.innerText = "accepted";
        setTimeout(() => {
            window.location.href = "videos.html";
        }, 800);
    } else {
        msg.innerText = "rejected";
        document.body.style.filter = "hue-rotate(20deg) contrast(1.2)";
        setTimeout(() => {
            document.body.style.filter = "none";
        }, 500);
    }
}
</script>

</body>
</html>
